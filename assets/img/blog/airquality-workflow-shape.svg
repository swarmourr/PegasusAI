<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" width="960" height="566" role="img"
     aria-label="Air quality workflow: for each sensor node, fetch then extract then analyse and find anomalies; results from all nodes are merged into one report.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .nm { font-size: 17px; font-weight: 650; fill: #0f172a; }
      .sb { font-size: 13px; fill: #64748b; }
      .lb { font-size: 11px; font-weight: 700; fill: #0284c7; letter-spacing: .14em; }
      .pl { font-size: 15px; font-weight: 600; fill: #0c4a6e; }
      .ln { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="960" height="566" fill="#ffffff"/>

  <rect x="315" y="24" width="330" height="48" rx="24" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.4"/>
  <text class="t pl" x="480" y="54" text-anchor="middle">SAGE Continuum sensor nodes</text>
  <path class="ln" d="M 480 72 L 480 104" marker-end="url(#ar)"/>

  <rect x="70" y="104" width="820" height="252" rx="20" fill="#f8fbfe" stroke="#7dd3fc" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text class="t lb" x="98" y="132">ONCE PER NODE  ·  W045, W06C</text>

  <rect class="card" x="100" y="192" width="196" height="74" rx="14"/>
  <text class="t nm" x="198" y="222" text-anchor="middle">fetch</text>
  <text class="t sb" x="198" y="244" text-anchor="middle">query the sensor API</text>

  <path class="ln" d="M 296 229 L 348 229" marker-end="url(#ar)"/>

  <rect class="card" x="348" y="192" width="196" height="74" rx="14"/>
  <text class="t nm" x="446" y="222" text-anchor="middle">extract</text>
  <text class="t sb" x="446" y="244" text-anchor="middle">build a time series</text>

  <path class="ln" d="M 544 229 L 570 229 L 570 181 L 596 181" marker-end="url(#ar)"/>
  <path class="ln" d="M 544 229 L 570 229 L 570 285 L 596 285" marker-end="url(#ar)"/>

  <rect class="card" x="596" y="147" width="200" height="68" rx="14"/>
  <text class="t nm" x="696" y="175" text-anchor="middle">analyse</text>
  <text class="t sb" x="696" y="196" text-anchor="middle">statistics and a plot</text>

  <rect class="card" x="596" y="251" width="200" height="68" rx="14"/>
  <text class="t nm" x="696" y="279" text-anchor="middle">find anomalies</text>
  <text class="t sb" x="696" y="300" text-anchor="middle">unusual readings</text>

  <path class="ln" d="M 480 356 L 480 394" marker-end="url(#ar)"/>

  <rect class="card" x="380" y="398" width="200" height="72" rx="14"/>
  <text class="t nm" x="480" y="427" text-anchor="middle">merge</text>
  <text class="t sb" x="480" y="449" text-anchor="middle">combine every node</text>

  <path class="ln" d="M 480 470 L 480 498" marker-end="url(#ar)"/>
  <rect x="326" y="502" width="308" height="42" rx="21" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.4"/>
  <text class="t pl" x="480" y="529" text-anchor="middle">one report, plus plots per node</text>
</svg>
