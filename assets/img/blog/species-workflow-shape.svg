<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 442" width="960" height="442" role="img"
     aria-label="Species workflow: for each species, fetch occurrence records then summarise them; results from all species are merged into one comparison table and figure.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .nm { font-size: 16px; font-weight: 650; fill: #0f172a; }
      .sb { font-size: 12.5px; fill: #64748b; }
      .lb { font-size: 11px; font-weight: 700; fill: #0284c7; letter-spacing: .14em; }
      .pl { font-size: 14px; font-weight: 600; fill: #0c4a6e; }
      .ln { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="960" height="442" fill="#ffffff"/>

  <rect x="330" y="22" width="300" height="46" rx="23" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.4"/>
  <text class="t pl" x="480" y="50" text-anchor="middle">GBIF occurrence records</text>
  <text class="t sb" x="480" y="86" text-anchor="middle">public, no API key</text>

  <path class="ln" d="M 480 96 L 480 122" marker-end="url(#ar)"/>

  <rect x="96" y="122" width="768" height="164" rx="18" fill="#f8fbfe" stroke="#7dd3fc" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text class="t lb" x="122" y="150">ONCE PER SPECIES</text>

  <rect class="card" x="140" y="176" width="292" height="80" rx="14"/>
  <text class="t nm" x="286" y="208" text-anchor="middle">fetch</text>
  <text class="t sb" x="286" y="230" text-anchor="middle">resolve the name, page the API</text>

  <path class="ln" d="M 432 216 L 512 216" marker-end="url(#ar)"/>

  <rect class="card" x="512" y="176" width="292" height="80" rx="14"/>
  <text class="t nm" x="658" y="208" text-anchor="middle">summarise</text>
  <text class="t sb" x="658" y="230" text-anchor="middle">statistics and a map</text>

  <path class="ln" d="M 480 286 L 480 314" marker-end="url(#ar)"/>

  <rect class="card" x="356" y="318" width="248" height="70" rx="14"/>
  <text class="t nm" x="480" y="346" text-anchor="middle">merge</text>
  <text class="t sb" x="480" y="367" text-anchor="middle">one row per species</text>

  <path class="ln" d="M 480 388 L 480 408" marker-end="url(#ar)"/>
  <rect x="322" y="408" width="316" height="30" rx="15" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.4"/>
  <text class="t pl" x="480" y="428" text-anchor="middle">comparison table and figure</text>
</svg>
