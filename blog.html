    <style>
        :root {
            --bg-main: #0b162b;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #38bdf8;
            --header-bg: #0b162b;
            --accent: #38bdf8;
        }

        body.light-mode {
            --bg-main: #ffffff;
            --bg-card: rgba(15, 23, 42, 0.03);
            --border-color: #e6eef8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --header-bg: rgba(255, 255, 255, 0.95);
            --accent: #0ea5e9;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.5s ease, color 0.5s ease;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 clamp(1.5rem, 4%, 3rem);
            transition: height 0.3s ease, background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        body:not(.light-mode) header {
            background: rgba(11, 22, 43, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.07);
        }
        body.light-mode header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 1px 12px rgba(2, 6, 23, 0.05);
        }
        header.header-scrolled { height: 68px; }
        body:not(.light-mode) header.header-scrolled {
            background: rgba(11, 22, 43, 0.96);
            border-bottom-color: rgba(56, 189, 248, 0.13);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
        }
        body.light-mode header.header-scrolled {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 2px 20px rgba(2, 6, 23, 0.08);
        }

        .nav-link {
            position: relative;
            color: #94a3b8;
            transition: color 0.3s ease;
        }
        .nav-link:hover { color: #f8fafc; }
        .nav-link.active { color: #fff !important; }
        body.light-mode .nav-link { color: #475569; }
        body.light-mode .nav-link:hover { color: #0f172a; }
        body.light-mode .nav-link.active { color: var(--accent) !important; }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #38bdf8;
        }

        @media (max-width: 1024px) {
            header { height: 68px; }
        }
        @media (max-width: 768px) {
            #main-nav { display: none; }
            #hamburger { display: flex !important; }
        }

        /* Logo switching */
        .light-logo-img { display: none !important; }
        .dark-logo-img { display: block !important; }
        body.light-mode .dark-logo-img { display: none !important; }
        body.light-mode .light-logo-img { display: block !important; }

        /* Glass card */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }
        body.light-mode .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid var(--border-color);
            backdrop-filter: none;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            bottom: 2.5rem;
            right: 2.5rem;
            z-index: 9999;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 2px solid var(--border-color);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }
        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }
        .theme-toggle .icon-wrapper {
            position: relative;
            width: 32px;
            height: 32px;
        }
        .theme-toggle .sun-icon,
        .theme-toggle .moon-icon {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        /* Dark mode: show moon, hide sun */
        .theme-toggle .sun-icon { opacity: 0; transform: rotate(90deg) scale(0.5); }
        .theme-toggle .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }
        /* Light mode: show sun, hide moon */
        body.light-mode .theme-toggle .sun-icon { opacity: 1; transform: rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .moon-icon { opacity: 0; transform: rotate(-90deg) scale(0.5); }

        /* Main content area */
        main {
            padding-top: 110px;
            min-height: 100vh;
            max-width: 1100px;
            margin: 0 auto;
            padding-left: 5%;
            padding-right: 5%;
            padding-bottom: 80px;
        }

        /* Blog card hover */
        .blog-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .blog-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(56, 189, 248, 0.08);
        }
        body.light-mode .blog-card:hover {
            box-shadow: 0 12px 36px rgba(14, 165, 233, 0.1);
        }

        /* Markdown rendered content */
        .md-content {
            line-height: 1.8;
            color: var(--text-main);
        }
        .md-content h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
            line-height: 1.1;
        }
        .md-content h2 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: #38bdf8;
        }
        body.light-mode .md-content h2 { color: #0ea5e9; }
        .md-content h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }
        .md-content p {
            margin-bottom: 1.25rem;
            color: var(--text-main);
            opacity: 0.85;
        }
        .md-content strong { color: var(--text-main); opacity: 1; font-weight: 700; }
        .md-content a { color: #38bdf8; text-decoration: underline; }
        body.light-mode .md-content a { color: #0ea5e9; }
        .md-content ul, .md-content ol {
            margin: 1rem 0 1.25rem 1.5rem;
            space-y: 0.5rem;
        }
        .md-content ul { list-style: disc; }
        .md-content ol { list-style: decimal; }
        .md-content li { margin-bottom: 0.4rem; opacity: 0.85; }
        .md-content pre {
            background: rgba(14, 165, 233, 0.06);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            overflow-x: auto;
            margin: 1.5rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }
        body.light-mode .md-content pre {
            background: #f0f7ff;
            border-color: rgba(14, 165, 233, 0.2);
        }
        .md-content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            background: rgba(56, 189, 248, 0.1);
            padding: 0.15em 0.4em;
            border-radius: 0.3em;
        }
        .md-content pre code {
            background: none;
            padding: 0;
        }
        .md-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }
        .md-content th {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.6rem 1rem;
            font-weight: 700;
            text-align: left;
        }
        .md-content td {
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            opacity: 0.8;
        }
        .md-content blockquote {
            border-left: 3px solid #38bdf8;
            padding-left: 1.25rem;
            margin: 1.5rem 0;
            opacity: 0.75;
            font-style: italic;
        }
        .md-content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2rem 0;
        }

        /* Loading spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Category tabs */
        .tab-btn {
            background: transparent;
            border-color: rgba(255,255,255,0.08);
            color: #64748b;
            cursor: pointer;
        }
        .tab-btn:hover { border-color: rgba(56,189,248,0.4); color: #38bdf8; }
        .tab-active { background: rgba(56,189,248,0.1); border-color: rgba(56,189,248,0.35) !important; color: #38bdf8 !important; }
        body.light-mode .tab-btn { border-color: #e2e8f0; color: #94a3b8; }
        body.light-mode .tab-btn:hover { border-color: #0ea5e9; color: #0ea5e9; }
        body.light-mode .tab-active { background: rgba(14,165,233,0.08); border-color: #0ea5e9 !important; color: #0ea5e9 !important; }

        /* Footer */
        footer {
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
            padding: 2rem 5%;
            text-align: center;
        }
    </style>
</head>

    <script>
        // --- Mobile menu ---
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // --- Header shrink on scroll ---
        (function () {
            const hdr = document.getElementById('main-header');
            window.addEventListener('scroll', function () {
                if (document.documentElement.scrollTop > 60) hdr.classList.add('header-scrolled');
                else hdr.classList.remove('header-scrolled');
            }, { passive: true });
        })();

        function applyTheme(mode) {
            if (mode === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
            localStorage.setItem('theme', mode);
        }
        function toggleTheme() {
            applyTheme(document.body.classList.contains('light-mode') ? 'dark' : 'light');
        }
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('theme');
            applyTheme(saved === 'light' || saved === 'dark' ? saved : 'light');
        });

        // --- Posts registry ---
        const POSTS = [
            {
                slug: 'intro-task-performance',
                title: 'Smarter Scheduling: Why HPC Needs Better Runtime Estimates',
                author: 'Pegasus AI Team',

                description: 'Why a single walltime estimate is not enough for production HPC workloads — and how Pegasus AI uses ML-based runtime envelopes to give schedulers the information they actually need.',
                category: 'task-performance',
                tag: 'Task Performance',
                icon: 'bar-chart-2'
            },
            {
                slug: 'intro-monitoring',
                title: 'Always On: Real-Time Workflow Monitoring with Pegasus AI',

            {
                slug: 'build-a-pegasus-workflow-with-claude-skills',

            {

            {
                slug: 'runtime-prediction-interval-envelopes',

            {
                slug: 'intro-education',
                title: 'Teaching Scientific Computing at Scale: PegasusAI in the Classroom',
                author: 'Pegasus AI Team',
                date: '2026-09-03',
                description: 'HPC workflows are not just a research tool — they are a skill students need. Pegasus AI integrates into academic courses to give students direct experience with real scientific computing infrastructure.',
                category: 'education',
                tag: 'Education',
                icon: 'book-open'
            },
            {
                slug: 'intro-ci-design',
                title: 'Built for the Infrastructure: CI-Ready Design in Pegasus AI',
                author: 'Pegasus AI Team',
                date: '2026-09-10',
                description: 'Pegasus AI is designed from the ground up to work within the NSF cyberinfrastructure ecosystem. What CI-ready design means in practice, and why it matters for reproducibility and interoperability.',
                category: 'ci-design',
                tag: 'CI Design',
                icon: 'component'
            }
        ];

        const CATEGORIES = [
            { id: 'task-performance', label: 'Task Performance',  icon: 'bar-chart-2' },
            { id: 'monitoring',       label: 'Monitoring',        icon: 'activity'    },
            { id: 'ai-workflows',     label: 'AI Workflows',      icon: 'bot'         },
            { id: 'education',        label: 'Education',         icon: 'book-open'   },
            { id: 'ci-design',        label: 'CI Design',         icon: 'component'   }
        ];

        // --- Listing ---
        let activeCategory = null;

        function renderTabs() {
            const tabs = document.getElementById('category-tabs');
            tabs.innerHTML = `
                <button onclick="setCategory(null)"
                    class="tab-btn ${!activeCategory ? 'tab-active' : ''} inline-flex items-center gap-2 px-4 py-1.5 rounded-full border text-[10px] font-bold tracking-[0.2em] uppercase mono transition-all">
                    All
                </button>` +
                CATEGORIES.map(c => `
                <button onclick="setCategory('${c.id}')"
                    class="tab-btn ${activeCategory === c.id ? 'tab-active' : ''} inline-flex items-center gap-2 px-4 py-1.5 rounded-full border text-[10px] font-bold tracking-[0.2em] uppercase mono transition-all">
                    <i data-lucide="${c.icon}" class="w-3 h-3"></i> ${c.label}
                </button>`).join('');
            lucide.createIcons();
        }

        function setCategory(id) {
            activeCategory = id;
            renderTabs();
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('posts-grid');
            const filtered = activeCategory ? POSTS.filter(p => p.category === activeCategory) : POSTS;
            grid.className = 'grid gap-6 md:grid-cols-2';
            grid.innerHTML = filtered.map(p => `
                <article class="blog-card glass-card rounded-2xl p-8 flex flex-col gap-5 cursor-pointer"
                    onclick="showPost('${p.slug}')" role="button" tabindex="0"
                    onkeydown="if(event.key==='Enter')showPost('${p.slug}')">
                    <div class="flex items-center gap-3">
                        <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-[10px] font-bold tracking-[0.2em] uppercase">
                            <i data-lucide="${p.icon}" class="w-3 h-3"></i> ${p.tag}
                        </span>
                    </div>
                    <h3 class="text-xl font-black tracking-tight leading-snug">${p.title}</h3>
                    <p class="text-sm opacity-70 leading-relaxed flex-1">${p.description}</p>
                    <div class="flex items-center justify-between mono text-[10px] tracking-widest text-slate-500 uppercase mt-auto pt-4 border-t border-white/5">
                        <span class="flex items-center gap-2"><i data-lucide="user" class="w-3 h-3"></i> ${p.author}</span>
                        <span class="flex items-center gap-2"><i data-lucide="calendar" class="w-3 h-3"></i> ${formatDate(p.date)}</span>
                    </div>
                </article>`).join('');
            lucide.createIcons();
        }

        function renderListing() {
            renderTabs();
            renderGrid();
        }

        // --- Routing ---
        function getPostSlug() {
            return new URLSearchParams(window.location.search).get('post');
        }
        function getCategoryParam() {
            return new URLSearchParams(window.location.search).get('category');
        }

        function showListing() {
            const url = activeCategory ? `blog.html?category=${activeCategory}` : 'blog.html';
            history.pushState({}, '', url);
            document.getElementById('listing-view').classList.remove('hidden');
            document.getElementById('post-view').classList.add('hidden');
            renderListing();
        }

        function showPost(slug) {
            const url = activeCategory ? `blog.html?category=${activeCategory}&post=${slug}` : `blog.html?post=${slug}`;
            history.pushState({}, '', url);
            document.getElementById('listing-view').classList.add('hidden');
            document.getElementById('post-view').classList.remove('hidden');
            loadPost(slug);
        }

        window.addEventListener('popstate', () => {
            const slug = getPostSlug();
            activeCategory = getCategoryParam();
            if (slug) {
                document.getElementById('listing-view').classList.add('hidden');
                document.getElementById('post-view').classList.remove('hidden');
                loadPost(slug);
            } else {
                document.getElementById('listing-view').classList.remove('hidden');
                document.getElementById('post-view').classList.add('hidden');
                renderListing();
            }
        });

        // --- Frontmatter parser ---
        function parseFrontmatter(text) {
            const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
            if (!match) return { meta: {}, content: text };
            const meta = {};
            match[1].split('\n').forEach(line => {
                const colon = line.indexOf(':');
                if (colon === -1) return;
                const key = line.slice(0, colon).trim();
                const val = line.slice(colon + 1).trim().replace(/^["']|["']$/g, '');
                meta[key] = val;
            });
            return { meta, content: match[2] };
        }

        // --- Load single post ---
        async function loadPost(slug) {
            const metaEl = document.getElementById('post-meta');
            const contentEl = document.getElementById('post-content');
            const loadingEl = document.getElementById('post-loading');

            contentEl.classList.add('hidden');
            loadingEl.classList.remove('hidden');
            metaEl.innerHTML = '';

            try {
                const res = await fetch(`blogs/${slug}.md`);
                if (!res.ok) throw new Error('Post not found');
                const { meta, content } = parseFrontmatter(await res.text());

                document.title = `${meta.title} | Pegasus AI Blog`;

                const postInfo = POSTS.find(p => p.slug === slug);
                metaEl.innerHTML = `
                    <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-[10px] font-bold tracking-[0.2em] uppercase mb-6">
                        <i data-lucide="${postInfo ? postInfo.icon : 'file-text'}" class="w-3 h-3"></i> ${meta.tag || (postInfo ? postInfo.tag : 'Blog Post')}
                    </div>
                    <h1 class="text-5xl md:text-6xl font-black tracking-tighter leading-tight mb-6">${meta.title}</h1>
                    <div class="flex flex-wrap items-center gap-6 mono text-[10px] tracking-widest text-slate-400 uppercase pb-8 border-b" style="border-color:var(--border-color)">
                        <span class="flex items-center gap-2"><i data-lucide="calendar" class="w-3 h-3"></i> ${formatDate(meta.date)}</span>
                        <span class="flex items-center gap-2"><i data-lucide="user" class="w-3 h-3"></i> ${meta.author}</span>
                    </div>
                `;

                contentEl.innerHTML = marked.parse(content);
                lucide.createIcons();
            } catch (err) {
                contentEl.innerHTML = `<p class="text-red-400">Could not load post: ${err.message}</p>`;
                contentEl.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
                contentEl.classList.remove('hidden');
            }
        }

        // --- Helpers ---
        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            activeCategory = getCategoryParam();
            const slug = getPostSlug();
            if (slug) {
                document.getElementById('listing-view').classList.add('hidden');
                document.getElementById('post-view').classList.remove('hidden');
                loadPost(slug);
            } else {
                renderListing();
            }
        });
    </script>
</body>
