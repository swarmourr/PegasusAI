<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/image.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/image.png">
    <meta name="theme-color" content="#0b162b">
    <title>Team | Pegasus AI</title>
    <meta name="description" content="Meet the multi-institutional team behind Pegasus AI — researchers from USC ISI, UTK, RENCI, and UMass Amherst.">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root { --accent: #38bdf8; }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b162b;
            color: #f8fafc;
            min-height: 100vh;
        }

        body.light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* ── Header ── */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 clamp(1.5rem, 4%, 3rem);
            background: rgba(11, 22, 43, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            transition: height 0.3s ease, box-shadow 0.3s ease;
        }
        body.light-mode header {
            background: rgba(248,250,252,0.92);
            border-bottom-color: rgba(0,0,0,0.06);
        }
        header.header-scrolled { height: 68px; }
        body:not(.light-mode) header.header-scrolled { box-shadow: 0 4px 24px rgba(0,0,0,0.25); }

        .nav-link {
            position: relative;
            color: #94a3b8;
            transition: color 0.3s ease;
        }
        .nav-link:hover { color: #f8fafc; }
        body.light-mode .nav-link { color: #475569; }
        body.light-mode .nav-link:hover { color: #0f172a; }

        /* ── Member card ── */
        .member-card {
            display: flex;
            flex-direction: column;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .member-card:hover { border-color: rgba(56,189,248,0.3); background: rgba(255,255,255,0.02); }
        body.light-mode .member-card { border-color: rgba(0,0,0,0.08); background: #fff; }
        body.light-mode .member-card:hover { border-color: rgba(14,165,233,0.4); box-shadow: 0 4px 24px rgba(14,165,233,0.08); }

        .image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: #0f172a;
        }
        body.light-mode .image-wrapper { background: #f1f5f9; border-bottom-color: rgba(0,0,0,0.05); }

        .hover-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: 36px; height: 36px;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 2;
            pointer-events: none;
        }
        .member-card:hover .hover-logo { opacity: 0.7; }

        /* ── Light mode toggle ── */
        #theme-toggle {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        #theme-toggle:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        body.light-mode #theme-toggle { border-color: rgba(0,0,0,0.12); color: #475569; }
        body.light-mode #theme-toggle:hover { color: #0f172a; }

        /* ── Institution header ── */
        .inst-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.5rem 2rem;
            border-radius: 1.25rem;
            border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.02);
            margin-bottom: 1.5rem;
        }
        body.light-mode .inst-header {
            background: #fff;
            border-color: rgba(0,0,0,0.07);
        }
        .inst-logo-wrap {
            width: 120px;
            height: 56px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inst-logo-wrap img {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
            opacity: 0.7;
        }
        body.light-mode .inst-logo-wrap img {
            filter: none;
            opacity: 0.85;
        }

        /* fade-in */
        .fade-in { animation: fadeUp 0.6s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>

<body>

    <!-- Header -->
    <header id="main-header">
        <!-- Logo -->
        <a href="index.html" class="flex items-center gap-3 shrink-0">
            <div class="shrink-0 overflow-hidden" style="width:46px;height:46px">
                <img src="assets/img/image1.png" alt="Pegasus AI" class="dark-logo-img"
                    style="width:46px;height:62px;object-fit:cover;object-position:top center;filter:brightness(1.1) drop-shadow(0 0 8px rgba(56,189,248,0.3))">
                <img src="assets/img/image.png" alt="Pegasus AI" class="light-logo-img"
                    style="width:46px;height:62px;object-fit:cover;object-position:top center">
            </div>
            <div class="flex flex-col leading-none">
                <span class="text-[17px] font-extrabold tracking-tight">Pegasus <span class="text-sky-400">AI</span></span>
                <span class="mono text-[7px] tracking-[0.3em] text-sky-400/50 mt-0.5 uppercase">Next-Gen Workflows</span>
            </div>
        </a>

        <!-- Desktop nav -->
        <nav id="main-nav" class="ml-auto flex items-center gap-1">
            <a href="index.html#about"        class="nav-link px-3 py-2 rounded-lg text-[15px] font-semibold hover:bg-white/5 transition-all">About</a>
            <a href="index.html#ecosystem"    class="nav-link px-3 py-2 rounded-lg text-[15px] font-semibold hover:bg-white/5 transition-all">Ecosystem</a>
            <a href="index.html#tech"         class="nav-link px-3 py-2 rounded-lg text-[15px] font-semibold hover:bg-white/5 transition-all">Tech</a>
            <a href="index.html#engine"       class="nav-link px-3 py-2 rounded-lg text-[15px] font-semibold hover:bg-white/5 transition-all">Engine</a>
            <a href="index.html#workflows"    class="nav-link px-3 py-2 rounded-lg text-[15px] font-semibold hover:bg-white/5 transition-all">Workflows</a>
            <a href="index.html#studio"       class="nav-link px-3 py-2 rounded-lg text-[15px] font-semibold hover:bg-white/5 transition-all">Studio</a>
            <a href="index.html#publications" class="nav-link px-3 py-2 rounded-lg text-[15px] font-semibold hover:bg-white/5 transition-all">Research</a>
            <span class="px-3 py-2 rounded-lg text-[15px] font-semibold text-white bg-white/8">Team</span>
            <div class="w-px h-4 bg-white/10 mx-2"></div>
            <a href="blog.html" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-sky-500/10 border border-sky-500/25 text-sky-400 text-[14px] font-bold hover:bg-sky-500 hover:text-white hover:border-sky-500 transition-all">
                Blog <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
            </a>
            <div class="w-px h-4 bg-white/10 mx-2"></div>
            <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                <i data-lucide="sun" class="w-4 h-4 hidden light-icon"></i>
                <i data-lucide="moon" class="w-4 h-4 dark-icon"></i>
            </button>
        </nav>

        <!-- Hamburger -->
        <button id="hamburger" onclick="toggleMobileMenu()" aria-label="Menu"
            class="ml-auto hidden flex-col gap-[5px] p-2 cursor-pointer text-slate-400 hover:text-white transition-colors">
            <span class="block w-5 h-[1.5px] bg-current rounded-full"></span>
            <span class="block w-5 h-[1.5px] bg-current rounded-full"></span>
            <span class="block w-3.5 h-[1.5px] bg-current rounded-full"></span>
        </button>
    </header>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="fixed inset-0 z-[999] hidden flex-col items-center justify-center gap-6"
        style="background: rgba(2,6,23,0.97); backdrop-filter: blur(20px);">
        <button onclick="toggleMobileMenu()" class="absolute top-5 right-5 p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <div class="flex items-center gap-2 mb-4">
            <div class="dark-logo-img shrink-0 overflow-hidden" style="width:36px;height:36px">
                <img src="assets/img/image1.png" alt="" style="width:36px;height:48px;object-fit:cover;object-position:top center;filter:brightness(1.1) drop-shadow(0 0 8px rgba(56,189,248,0.3))">
            </div>
            <span class="text-base font-extrabold tracking-tight text-white">Pegasus <span class="text-sky-400">AI</span></span>
        </div>
        <nav class="flex flex-col items-center gap-1 w-full max-w-xs px-4">
            <a href="index.html#about"        onclick="toggleMobileMenu()" class="w-full text-center px-6 py-3 rounded-xl text-base font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all">About</a>
            <a href="index.html#ecosystem"    onclick="toggleMobileMenu()" class="w-full text-center px-6 py-3 rounded-xl text-base font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all">Ecosystem</a>
            <a href="index.html#tech"         onclick="toggleMobileMenu()" class="w-full text-center px-6 py-3 rounded-xl text-base font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all">Tech</a>
            <a href="index.html#engine"       onclick="toggleMobileMenu()" class="w-full text-center px-6 py-3 rounded-xl text-base font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all">Engine</a>
            <a href="index.html#workflows"    onclick="toggleMobileMenu()" class="w-full text-center px-6 py-3 rounded-xl text-base font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all">Workflows</a>
            <a href="index.html#studio"       onclick="toggleMobileMenu()" class="w-full text-center px-6 py-3 rounded-xl text-base font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all">Studio</a>
            <a href="index.html#publications" onclick="toggleMobileMenu()" class="w-full text-center px-6 py-3 rounded-xl text-base font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all">Research</a>
            <span class="w-full text-center px-6 py-3 rounded-xl text-base font-semibold text-white bg-white/8">Team</span>
            <div class="w-full h-px bg-white/5 my-2"></div>
            <a href="blog.html" onclick="toggleMobileMenu()"
                class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-sky-500/10 border border-sky-500/25 text-sky-400 text-sm font-bold">
                Blog <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
            </a>
        </nav>
    </div>

    <!-- Main -->
    <main class="pt-32 pb-24 min-h-screen">
        <div class="max-w-7xl mx-auto px-6">

            <!-- Page header -->
            <div class="mb-20 fade-in">
                <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-[10px] font-bold tracking-[0.2em] uppercase mb-6">
                    <i data-lucide="users" class="w-3 h-3"></i> Multi-Institutional Team
                </div>
                <h1 class="text-6xl font-black uppercase italic tracking-tighter leading-none mb-4">
                    The <span class="text-sky-500">Team</span>
                </h1>
                <p class="text-slate-400 mono text-xs tracking-[0.4em] uppercase">Researchers across the NSF ecosystem</p>
            </div>

            <!-- Institution sections — filled by JS -->
            <div id="team-by-institution" class="space-y-20"></div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative bg-slate-950 border-t border-white/5 overflow-hidden">
        <div class="absolute inset-0 pointer-events-none">
            <div style="position:absolute;bottom:-120px;left:10%;width:600px;height:400px;background:radial-gradient(ellipse,rgba(56,189,248,0.06) 0%,transparent 70%);border-radius:50%"></div>
        </div>
        <div class="relative max-w-7xl mx-auto px-6 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-2">
                <div class="shrink-0 overflow-hidden" style="width:28px;height:28px">
                    <img src="assets/img/image1.png" alt="Pegasus AI" class="dark-logo-img" style="width:28px;height:38px;object-fit:cover;object-position:top center">
                    <img src="assets/img/image.png" alt="Pegasus AI" class="light-logo-img" style="width:28px;height:38px;object-fit:cover;object-position:top center">
                </div>
                <span class="text-sm font-bold text-white">Pegasus <span class="text-sky-400">AI</span></span>
            </a>
            <p class="mono text-[10px] text-slate-600 tracking-widest uppercase">NSF-funded · USC ISI · UTK · RENCI · UMass</p>
            <div class="flex items-center gap-2">
                <a href="https://github.com/pegasus-isi" target="_blank" rel="noopener noreferrer" aria-label="GitHub"
                    class="w-8 h-8 flex items-center justify-center rounded-lg border border-white/8 text-slate-600 hover:text-white hover:border-white/20 transition-all">
                    <i data-lucide="github" class="w-3.5 h-3.5"></i>
                </a>
                <a href="mailto:pegasus-support@isi.edu" aria-label="Email"
                    class="w-8 h-8 flex items-center justify-center rounded-lg border border-white/8 text-slate-600 hover:text-sky-400 hover:border-sky-500/30 transition-all">
                    <i data-lucide="mail" class="w-3.5 h-3.5"></i>
                </a>
            </div>
        </div>
    </footer>

    <script>
        // ── Light/dark mode ──
        const saved = localStorage.getItem('theme');
        if (saved === 'light') document.body.classList.add('light-mode');
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            updateThemeIcons();
        }
        function updateThemeIcons() {
            const light = document.body.classList.contains('light-mode');
            document.querySelectorAll('.light-icon').forEach(el => el.classList.toggle('hidden', !light));
            document.querySelectorAll('.dark-icon').forEach(el => el.classList.toggle('hidden', light));
        }

        // ── Dark/light logo images ──
        function applyLogoMode() {
            const light = document.body.classList.contains('light-mode');
            document.querySelectorAll('.dark-logo-img').forEach(el => el.style.display = light ? 'none' : '');
            document.querySelectorAll('.light-logo-img').forEach(el => el.style.display = light ? '' : 'none');
        }
        applyLogoMode();
        const _orig = toggleTheme;
        function toggleTheme() { _orig(); applyLogoMode(); }

        // ── Mobile menu ──
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // ── Header shrink ──
        window.addEventListener('scroll', () => {
            document.getElementById('main-header').classList.toggle('header-scrolled', window.scrollY > 60);
        }, { passive: true });

        // ── Hamburger responsive ──
        function checkHamburger() {
            const ham = document.getElementById('hamburger');
            const nav = document.getElementById('main-nav');
            if (window.innerWidth < 900) {
                ham.style.display = 'flex';
                nav.style.display = 'none';
            } else {
                ham.style.display = 'none';
                nav.style.display = 'flex';
            }
        }
        checkHamburger();
        window.addEventListener('resize', checkHamburger);

        // ── Institution config ──
        const INSTITUTIONS = [
            {
                id: 'ISI / USC',
                name: 'USC Information Sciences Institute',
                short: 'USC ISI',
                url: 'https://www.isi.edu',
                logo: 'https://swarm-workflows.org/images/isi.png',
                badge: 'Lead Institution',
                accentClass: 'text-sky-400',
                borderClass: 'border-sky-500/30',
                bgClass: 'bg-sky-500/5'
            },
            {
                id: 'UTK',
                name: 'University of Tennessee, Knoxville',
                short: 'UT Knoxville',
                url: 'https://www.utk.edu',
                logo: 'https://logos-world.net/wp-content/uploads/2022/01/University-of-Tennessee-Logo.png',
                badge: 'Partner',
                accentClass: 'text-violet-400',
                borderClass: 'border-violet-500/30',
                bgClass: 'bg-violet-500/5'
            },
            {
                id: 'RENCI / UNC',
                name: 'Renaissance Computing Institute / UNC',
                short: 'RENCI',
                url: 'https://renci.org',
                logo: 'https://swarm-workflows.org/images/RENCI.png',
                badge: 'Partner',
                accentClass: 'text-emerald-400',
                borderClass: 'border-emerald-500/30',
                bgClass: 'bg-emerald-500/5'
            },
            {
                id: 'UMass',
                name: 'University of Massachusetts Amherst',
                short: 'UMass Amherst',
                url: 'https://www.umass.edu',
                logo: 'https://www.umass.edu/brand/sites/default/files/styles/tile_max_250px/public/2026-02/UMassAmherst_longform-nowhitespace.png',
                badge: 'Partner',
                accentClass: 'text-amber-400',
                borderClass: 'border-amber-500/30',
                bgClass: 'bg-amber-500/5'
            }
        ];

        // ── Load & render ──
        async function loadTeam() {
            const container = document.getElementById('team-by-institution');
            try {
                const data = await fetch('assets/data/team.json').then(r => r.json());
                const members = data.team || [];

                const html = INSTITUTIONS.map(inst => {
                    const group = members.filter(m => m.role === inst.id);
                    if (!group.length) return '';

                    const cards = group.map(person => `
                        <div class="member-card group">
                            <div class="image-wrapper">
                                <img src="assets/img/image.png" class="hover-logo" alt="Pegasus Logo">
                                <img src="${person.image}" alt="${person.name}" loading="lazy"
                                    class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500 scale-105 group-hover:scale-100">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            </div>
                            <div class="p-4 flex flex-col gap-3">
                                <div>
                                    <h4 class="text-sm font-bold text-white leading-tight">${person.name}</h4>
                                    <p class="${inst.accentClass} mono text-[9px] font-bold tracking-widest uppercase mt-0.5">${inst.short}</p>
                                </div>
                                <div class="flex items-center justify-between pt-3 border-t border-white/5">
                                    <a href="mailto:${person.email}" class="p-1.5 rounded-lg hover:bg-sky-500/10 text-slate-600 hover:text-sky-400 transition-colors" title="${person.email}">
                                        <i data-lucide="mail" class="w-3.5 h-3.5"></i>
                                    </a>
                                    <span class="text-[8px] text-slate-700 mono uppercase tracking-widest">${person.status}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    return `
                        <div class="fade-in">
                            <!-- Institution header -->
                            <div class="inst-header ${inst.borderClass} border" style="border-color: inherit">
                                <a href="${inst.url}" target="_blank" rel="noopener noreferrer" class="inst-logo-wrap shrink-0">
                                    <img src="${inst.logo}" alt="${inst.short}">
                                </a>
                                <div class="h-10 w-px bg-white/8 shrink-0"></div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-3 flex-wrap">
                                        <h2 class="text-lg font-black tracking-tight text-white">${inst.name}</h2>
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full ${inst.bgClass} border ${inst.borderClass} ${inst.accentClass} mono text-[9px] font-bold tracking-widest uppercase">${inst.badge}</span>
                                    </div>
                                    <p class="mono text-[10px] text-slate-500 mt-1 tracking-widest uppercase">${group.length} member${group.length !== 1 ? 's' : ''}</p>
                                </div>
                                <a href="${inst.url}" target="_blank" rel="noopener noreferrer"
                                    class="shrink-0 ${inst.accentClass} opacity-40 hover:opacity-100 transition-opacity">
                                    <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                                </a>
                            </div>
                            <!-- Members grid -->
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                                ${cards}
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;
                lucide.createIcons();
                updateThemeIcons();
                applyLogoMode();
            } catch (err) {
                container.innerHTML = '<p class="text-slate-500 text-center py-16">Could not load team data.</p>';
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            updateThemeIcons();
            applyLogoMode();
            loadTeam();
        });
    </script>

</body>
</html>
